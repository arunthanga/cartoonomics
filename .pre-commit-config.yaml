# Opt-in local hooks: `pip install pre-commit && pre-commit install`.
# CI enforces tests; these keep commits tidy before they get there.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.2
    hooks:
      - id: ruff          # lint the Python pipeline
        args: [--fix]
      - id: ruff-format   # format the Python pipeline
