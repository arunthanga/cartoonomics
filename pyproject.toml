[project]
name = "cartoonomics"
version = "0.1.0"
description = "Aggregate, analyze, and cartoonize Indian financial data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Real document parsing (PDF). Kept optional so the core stays light.
parsing = [
    "pdfplumber>=0.11",
]
# Everything needed to run the test suites (TDD workflow).
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
    "pdfplumber>=0.11",
    "fpdf2>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages/pipeline/src"]

[tool.setuptools.package-data]
cartoonomics = ["data/*.csv"]

[tool.pytest.ini_options]
pythonpath = ["packages/pipeline/src", "packages/pipeline"]
testpaths = ["packages/pipeline/tests"]
markers = [
    "unit: fast, isolated unit tests",
    "regression: golden/behaviour regression tests guarding the CartoonSpec contract",
]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["cartoonomics"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
